name: Update data and deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "public/data/**"
      - "public/feed.xml"
      - "README.md"
  schedule:
    - cron: "30 0 * * *" # 08:30 Asia/Shanghai, incremental
    - cron: "15 1 * * 0" # weekly full backfill
  workflow_dispatch:
    inputs:
      since:
        description: "Optional discovery start date (YYYY-MM-DD); leave blank for full backfill"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover and merge outputs
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
          REQUESTED_SINCE: ${{ inputs.since }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$REQUESTED_SINCE" ]; then
            python3 scripts/pipeline.py fetch --since "$REQUESTED_SINCE"
          elif [ "$SCHEDULE" = "15 1 * * 0" ]; then
            python3 scripts/pipeline.py fetch
          else
            python3 scripts/pipeline.py fetch --since "$(date -u -d '8 days ago' +%F)"
          fi

      - name: Validate data and application
        run: npm test

      - name: Commit data changes
        run: |
          if [ -n "$(git status --porcelain -- data public/data public/feed.xml README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data public/data public/feed.xml README.md
            git commit -m "chore(data): automated research index update"
            git push
          else
            echo "No metadata changes to commit."
          fi

      - name: Export static GitHub Pages bundle
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
